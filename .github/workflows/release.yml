name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            target: x86_64-unknown-linux-gnu
          - platform: linux/arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: matrix.platform == 'linux/arm64'
      - uses: docker/setup-buildx-action@v3
      # Build through the Dockerfile so release binaries match the image.
      # QEMU is build-only; runtime performance is not a claim.
      - name: Build rootfs
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=local,dest=${{ runner.temp }}/rootfs
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Package
        run: |
          set -eu
          name="nusapeta-place_${GITHUB_REF_NAME#v}_${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "${{ runner.temp }}/rootfs/usr/local/bin/nusa-place" "dist/$name/"
          cp "${{ runner.temp }}/rootfs/usr/local/bin/nusa-place-build" "dist/$name/"
          cp LICENSE LICENSE-DATA README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nusapeta/place
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
