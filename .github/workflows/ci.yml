name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded pushes stop the previous run. The arm64 job alone is ~50 minutes
# under QEMU, so a queue of stale runs would hide the real duration.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check documentation
        run: python3 scripts/check_consistency.py
      - name: Reject data files
        run: |
          if git ls-files | grep -E '(\.pbf$|\.osm\.pbf$|\.idx$|\.idx\.json$)' \
            | grep -v '^tests/fixtures/'; then
            echo "PBF or index artifact tracked outside tests/fixtures" >&2
            exit 1
          fi
          if git ls-files | grep -E '^bench-results/'; then
            echo "benchmark output tracked" >&2
            exit 1
          fi
      - name: Check fixture size
        run: |
          test ! -d tests/fixtures || \
            find tests/fixtures -type f -name '*.pbf' -size +1M -print -quit | \
            (! grep -q .)

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Install audit tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Audit
        run: cargo audit
      - name: Licenses
        run: cargo deny check licenses

  arm64:
    # A full Rust release build under QEMU takes ~50 minutes; running it on
    # every pull request queues the runner for an hour and slows every review.
    # It runs on main after merge, which still catches arm64 breakage before a
    # tag (the release workflow also builds linux/arm64).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # Build and smoke only: runtime under QEMU is not a performance claim
      # for NFR-007.
      - name: Build arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: nusapeta-place:arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: Smoke arm64
        run: docker run --rm --platform linux/arm64 nusapeta-place:arm64 --help
