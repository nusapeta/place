# Rate limit per IP di edge openresty: placeid sendiri tidak punya rate limit.
limit_req_zone $binary_remote_addr zone=placeid:10m rate=20r/s;

# Port 80 menerima dua jenis trafik: klien langsung (diarahkan ke https) dan
# origin Cloudflare pada zona mode Flexible (X-Forwarded-Proto terisi). Redirect
# tanpa syarat akan membuat loop 301 di mode itu, jadi syaratnya diperiksa.
server {
    listen 80;
    server_name place.arifsani.xyz;

    access_log /www/sites/arifsani.xyz/log/place-access.log main;
    error_log /www/sites/arifsani.xyz/log/place-error.log;

    client_max_body_size 1m;

    if ($http_x_forwarded_proto = "") {
        return 301 https://$host$request_uri;
    }

    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:18092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        limit_req zone=placeid burst=40 nodelay;
        limit_req_status 429;
        proxy_read_timeout 15s;
        proxy_connect_timeout 3s;
    }
}

server {
    listen 443 ssl http2;
    server_name place.arifsani.xyz;

    # Sertifikat wildcard zona (*.arifsani.xyz, Cloudflare Origin CA). Hanya
    # dipercaya browser kalau trafik lewat proxy Cloudflare; akses LAN langsung
    # memunculkan peringatan sertifikat sampai Let's Encrypt diterbitkan untuk
    # host ini.
    ssl_certificate /www/sites/arifsani.xyz/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/arifsani.xyz/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /www/sites/arifsani.xyz/log/place-access.log main;
    error_log /www/sites/arifsani.xyz/log/place-error.log;

    client_max_body_size 1m;

    location = /metrics {
        return 404;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:18092;
    }

    location / {
        proxy_pass http://127.0.0.1:18092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        limit_req zone=placeid burst=40 nodelay;
        limit_req_status 429;
        proxy_read_timeout 15s;
        proxy_connect_timeout 3s;
    }
}
