# Layanan produksi nusapeta-place: satu index Indonesia, satu container read-only.
#   cp .env.example .env && docker compose up -d
# Index tidak dibangun di sini; artefak rilis diletakkan di ../data:
#   places.idx, places.idx.json, places.idx.sha256.
#
# Nama project eksplisit supaya beberapa deployment di host yang sama tidak
# bertabrakan saat direktori juga bernama `deploy`.
#
# Satu container melayani satu index. Index immutable selama proses hidup:
# index baru berarti restart (lihat docs/OPERATIONS.md).
name: nusapeta-place

x-nusapeta-place: &nusapeta-place
  image: ${NUSA_PLACE_IMAGE:-ghcr.io/nusapeta/place:0.1.0}
  restart: unless-stopped
  user: "65532:65532"
  read_only: true
  volumes:
    # Index mmap read-only. Container tidak perlu akses tulis ke mana pun.
    - ../data:/data:ro
  environment:
    RUST_LOG: info
    NUSA_PLACE_LOG_FORMAT: json
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 128
  # Terukur: index 142 MB dipetakan read-only (halaman file bisa direklaim
  # cgroup), RSS anon saat idle di bawah 20 MB.
  mem_limit: 256m
  memswap_limit: 256m
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/healthz"]
    interval: 30s
    timeout: 3s
    retries: 3
    start_period: 10s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  nusapeta-place:
    <<: *nusapeta-place
    container_name: nusapeta-place
    ports:
      # Hanya loopback: jalur publik lewat reverse proxy atau tunnel, bukan
      # port host. Ganti lewat NUSA_PLACE_PORT bila 8090 sudah dipakai.
      - "127.0.0.1:${NUSA_PLACE_PORT:-8090}:8090"
    command:
      - --index
      - /data/places.idx
      - --manifest
      - /data/places.idx.json
      # Gagal start kalau isi file tidak cocok dengan checksum manifest.
      - --verify-checksum
      # Container tetap mendengar di semua interface di dalam bridge docker;
      # yang membatasi cakupan adalah port host di atas.
      - --bind
      - 0.0.0.0:8090
    # /metrics ikut terbit di sini. Jangan arahkan domain publik apa adanya
    # ke service ini tanpa menutup /metrics lebih dulu (README §4).
