# cargo-deny: licenses only in CI; audit and dependency policy stay in
# .cargo/audit.toml and Dependabot so there is one source per concern.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "MIT-0",
]
confidence-threshold = 0.8

[advisories]
ignore = ["RUSTSEC-2026-0186"]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
