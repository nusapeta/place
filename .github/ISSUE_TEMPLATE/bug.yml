name: Laporan bug
description: Perilaku yang salah, crash, atau respons HTTP tak terduga
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Jangan laporkan kerentanan di sini. Baca `SECURITY.md`.
        Untuk nama tempat yang hilang atau hasil reverse yang meleset, pakai
        formulir "Laporan data atau hasil pencarian".
  - type: textarea
    id: what
    attributes:
      label: Apa yang terjadi
      description: Respons aktual, kode status, dan pesan error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Apa yang diharapkan
    validations:
      required: true
  - type: input
    id: request
    attributes:
      label: Request
      description: URL lengkap atau perintah curl.
      placeholder: curl -s 'http://127.0.0.1:8090/search?q=monas&limit=3'
    validations:
      required: true
  - type: textarea
    id: index
    attributes:
      label: Index dan versi
      description: Keluaran `/healthz` (manifest_sha256, jumlah fitur) dan `/version`.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: Baris log terkait, tanpa data pribadi.
      render: text
