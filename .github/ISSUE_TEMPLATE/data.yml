name: Data or search report
description: Missing place name, wrong ranking, or wrong reverse result
title: "data: "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        Most errors come from OpenStreetMap data. The permanent fix usually
        goes into OSM, and the next monthly index picks it up.
  - type: textarea
    id: query
    attributes:
      label: Query or coordinates
      description: Exactly as sent, including `limit` and language.
      placeholder: "q=monas&limit=3 or lat=-6.175392&lon=106.827153"
    validations:
      required: true
  - type: dropdown
    id: endpoint
    attributes:
      label: Endpoint
      options:
        - /search
        - /reverse
        - /lookup
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Current result
      description: Result summary, `place_id`, and OSM link if available.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Which feature should appear, and why.
    validations:
      required: true
  - type: input
    id: index
    attributes:
      label: Index
      description: Manifest hash from `/healthz` or the data release name.
      placeholder: places.idx 2026-11
  - type: checkboxes
    id: osm
    attributes:
      label: Source data
      options:
        - label: I checked the related OSM objects and believe the data is correct.
